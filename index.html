<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nael Food – Open PO</title>
  <meta name="theme-color" content="#FF7A00">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Nael Food">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'media' }</script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-stone-100 text-stone-900 dark:bg-neutral-900 dark:text-stone-100 min-h-screen pb-28">
  <div id="loading" class="fixed inset-0 z-50 grid place-items-center bg-white dark:bg-neutral-900">
    <div class="animate-pulse text-orange-500 font-extrabold text-xl">Nael Food…</div>
  </div>

  <header class="bg-orange-500 text-white px-5 pt-8 pb-14 rounded-b-[2rem]">
    <div class="max-w-xl mx-auto">
      <div class="flex items-center gap-3">
        <!-- Logo placeholder: ganti dengan <img> jika sudah punya logo -->
        <svg class="w-12 h-12" viewBox="0 0 96 96"><rect width="96" height="96" rx="22" fill="#fff"/><path d="M16 58c0-17 14-30 32-30s32 13 32 30c0 4-3 7-7 7H23c-4 0-7-3-7-7z" fill="#FF7A00"/><path d="M28 36l4 10M40 31l2 12M56 31l-2 12M68 36l-4 10" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>
        <h1 class="text-2xl font-extrabold">Nael Food</h1>
      </div>
      <p id="info" class="mt-4 text-sm text-orange-50">Home Made by Nael Food. Tanpa pengawet, aman untuk anak-anak.</p>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 -mt-9">
    <section class="card p-4">
      <div class="flex justify-between text-sm">
        <div><div class="text-stone-500">Mulai PO</div><b id="poStart">-</b></div>
        <div class="text-right"><div class="text-stone-500">Tutup PO</div><b id="poEnd">-</b></div>
      </div>
      <div id="countdown" class="mt-3 text-center text-lg font-extrabold text-orange-500"></div>
    </section>
    <section id="products" class="mt-5 grid gap-3"></section>
  </main>

  <!-- Tombol checkout melayang + keranjang sticky -->
  <button id="cartBar" class="hidden fixed left-4 right-4 bottom-4 max-w-xl mx-auto z-30 bg-orange-500 text-white rounded-2xl px-5 py-4 shadow-xl flex justify-between font-semibold"></button>

  <!-- Bottom sheet: keranjang + form + sukses -->
  <div id="sheet" class="hidden fixed inset-0 z-40 bg-black/50 flex items-end">
    <div class="sheet w-full max-w-xl mx-auto bg-white dark:bg-neutral-800 rounded-t-3xl p-5 max-h-[90vh] overflow-y-auto" id="sheetBody"></div>
  </div>
  <div id="toast" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-stone-900 text-white text-sm px-4 py-2 rounded-xl"></div>

  <script type="module" src="js/app.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js');</script>
</body>
</html>
