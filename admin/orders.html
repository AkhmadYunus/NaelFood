<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#FF7A00">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:"media"}</script><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><link rel="stylesheet" href="../css/style.css"><title>Order – Nael Food Admin</title></head>
<body class="bg-stone-100 text-stone-900 dark:bg-neutral-900 dark:text-stone-100 min-h-screen">
<main class="max-w-5xl mx-auto p-4">
  <h1 class="text-xl font-extrabold mb-3">Order</h1>
  <div class="flex flex-wrap gap-2 mb-3"><input id="q" class="inp" placeholder="Cari nama / nomor order"><select id="st" class="inp !w-40"><option value="">Semua status</option></select>
    <button id="xx" class="btn">Export Excel</button><button id="xcsv" class="btn2">Export CSV</button></div>
  <div class="flex flex-wrap items-center gap-2 mb-3"><button id="pInv" class="btn">Print Invoice</button><button id="pLbl" class="btn">Print Label Packing</button><a href="print.html" class="btn2">Halaman Cetak</a><span id="selInfo" class="text-sm text-stone-500"></span></div>
  <div class="card overflow-x-auto"><table class="w-full text-sm"><thead class="text-left text-stone-500"><tr>
    <th class="p-3"><input type="checkbox" id="all" class="w-4 h-4 accent-orange-500" aria-label="Pilih semua"></th><th class="p-3">No. Order</th><th class="p-3">Nama</th><th class="p-3">Total</th><th class="p-3">Status</th><th class="p-3"></th></tr></thead><tbody id="rows"></tbody></table></div>
</main>
<script type="module">
import { requireLogin, nav, get, post, $, rp, esc, fmtDT, toast, openModal, closeModal } from './admin.js';
import { orderRows, download } from './stats.js';
requireLogin(); nav('orders');
const STATUS = ['Baru', 'Diproses', 'Selesai', 'Dibatalkan'];
let orders = [], items = [];
const picked = new Set();   // order yang dicentang untuk cetak massal
$('#st').insertAdjacentHTML('beforeend', STATUS.map(s => `<option>${s}</option>`).join(''));
const sel = (o) => `<select data-id="${esc(o.order_id)}" class="inp !py-1.5 !w-32">${STATUS.map(s => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}</select>`;

async function load() {
  [orders, items] = await Promise.all([get('orders'), get('orderItems')]);
  orders.reverse(); render();
}
function filtered() {
  const q = $('#q').value.toLowerCase(), st = $('#st').value;
  return orders.filter(o => (!st || o.status === st) && (!q || (o.name + o.order_id).toLowerCase().includes(q)));
}
function render() {
  const list = filtered();
  $('#rows').innerHTML = list.map(o => `<tr class="border-t border-stone-200 dark:border-neutral-700">
    <td class="p-3"><input type="checkbox" data-sel="${esc(o.order_id)}" class="w-4 h-4 accent-orange-500" ${picked.has(o.order_id) ? 'checked' : ''} aria-label="Pilih ${esc(o.order_id)}"></td>
    <td class="p-3 font-semibold whitespace-nowrap">${esc(o.order_id)}<div class="text-xs font-normal text-stone-500">${fmtDT(o.created_at)}</div></td>
    <td class="p-3">${esc(o.name)}</td><td class="p-3 whitespace-nowrap">${rp(o.total)}</td><td class="p-3">${sel(o)}</td>
    <td class="p-3"><button class="text-orange-600 font-semibold" data-detail="${esc(o.order_id)}">Detail</button></td></tr>`).join('')
    || '<tr><td colspan="6" class="p-6 text-center text-stone-500">Tidak ada order.</td></tr>';
  $('#all').checked = list.length > 0 && list.every(o => picked.has(o.order_id));
  $('#selInfo').textContent = picked.size ? picked.size + ' order dipilih' : '';
}
async function setStatus(id, status) {
  try { await post({ action: 'updateOrder', order_id: id, status }); orders.find(o => o.order_id === id).status = status; toast('Status diperbarui'); }
  catch (x) { toast(x.message, true); } finally { render(); }
}
function detail(id) {
  const o = orders.find(x => x.order_id === id), its = items.filter(i => i.order_id === id);
  const wa = String(o.whatsapp).replace(/^0/, '62').replace(/\D/g, '');
  const m = openModal(`<h2 class="font-extrabold text-lg">${esc(o.order_id)}</h2><p class="text-xs text-stone-500 mb-3">${fmtDT(o.created_at)}</p>
    <div class="grid gap-1 text-sm"><div><b>Nama:</b> ${esc(o.name)}</div><div><b>WhatsApp:</b> <a class="text-green-600 underline" target="_blank" rel="noopener" href="https://wa.me/${wa}">${esc(o.whatsapp)}</a></div>
    <div><b>Divisi:</b> ${esc(o.division) || '-'}</div><div><b>Catatan:</b> ${esc(o.notes) || '-'}</div></div>
    <div class="mt-3 border-t border-stone-200 dark:border-neutral-700">${its.map(i => `<div class="flex justify-between py-2 text-sm"><span>${esc(i.product_name)} × ${esc(i.qty)}</span><span>${rp(i.subtotal)}</span></div>`).join('')}
    <div class="flex justify-between font-extrabold pt-2 border-t border-stone-200 dark:border-neutral-700"><span>Total</span><span class="text-orange-500">${rp(o.total)}</span></div></div>
    <div class="mt-4 flex gap-2"><button id="dInv" class="btn">Print Invoice</button><button id="dLbl" class="btn2">Print Label</button></div>
    <div class="mt-3 flex items-center gap-2"><span class="text-sm">Status:</span>${sel(o)}<button id="x" class="btn2 ml-auto">Tutup</button></div>`);
  m.querySelector('#x').onclick = closeModal;
  m.querySelector('#dInv').onclick = () => go([id], 'invoice');   // cetak per order
  m.querySelector('#dLbl').onclick = () => go([id], 'label');
}
$('#q').oninput = $('#st').onchange = render;
document.addEventListener('change', (e) => { if (e.target.dataset.id) setStatus(e.target.dataset.id, e.target.value); });
document.addEventListener('click', (e) => { const b = e.target.closest('[data-detail]'); if (b) detail(b.dataset.detail); });
// Export = data yang sedang tampil (sesuai pencarian & filter status)
const exp = (fmt) => download(orderRows(filtered(), items), fmt, 'order') || toast('Tidak ada data untuk diekspor', true);
$('#xx').onclick = () => exp('xlsx'); $('#xcsv').onclick = () => exp('csv');
// ---- Cetak massal: kirim daftar order ke print.html ----
const go = (ids, mode) => { sessionStorage.setItem('nael_print', JSON.stringify({ ids, mode })); location.href = 'print.html'; };
const goPicked = (mode) => picked.size ? go([...picked], mode) : toast('Centang order yang akan dicetak', true);
$('#pInv').onclick = () => goPicked('invoice'); $('#pLbl').onclick = () => goPicked('label');
$('#all').onchange = (e) => { filtered().forEach(o => e.target.checked ? picked.add(o.order_id) : picked.delete(o.order_id)); render(); };
document.addEventListener('change', (e) => { const s = e.target.dataset.sel; if (s) { e.target.checked ? picked.add(s) : picked.delete(s); render(); } });
load().catch(x => toast(x.message, true));
</script></body></html>
